<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>F1TV — Live Formula 1 Streaming &amp; Timing</title>
    <meta
      name="description"
      content="Watch Formula 1 live, follow real-time session countdowns, live track weather, race results, qualifying, the starting grid, championship standings and highlights."
    />
    <meta name="theme-color" content="#07080a" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="F1TV" />
    <meta property="og:title" content="F1TV — Live Formula 1 Streaming &amp; Timing" />

      property="og:description"
      content="Live Formula 1 streams, session countdowns, live weather, results, grid, standings and highlights."
    />
    <meta property="og:image" content="/android-chrome-512x512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Fonts: Geist (UI), Geist Mono (numerics), Archivo (display wordmark) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap"

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "F1TV",
        "description": "Live Formula 1 streaming, timing, results and standings.",
        "url": "https://f1tv.vercel.app"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; color: #e8ecf1">

    </noscript>
    <script type="module" src="/src/main.tsx"></script>
